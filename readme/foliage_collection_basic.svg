<svg xmlns="http://www.w3.org/2000/svg" width="965" height="2109" viewBox="0 0 965 2109">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">/// A readily available implementation for the [FoliageLayerBasic].</tspan></text>
  <text x="16" y="50"><tspan fill="#8b949e">/// This should be enough for most basic use cases, like placing some trees and grass.</tspan></text>
  <text x="16" y="70"><tspan fill="#8b949e">/// For more advanced use cases, implement your own subclass of [FoliageLayer].</tspan></text>
  <text x="16" y="90"><tspan fill="#79c0ff">@icon</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"pkg://icons/foliage_collection.svg"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="110"><tspan fill="#79c0ff">@profile</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"foliage"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="130"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">FoliageCollectionBasic</tspan></text>
  <text x="16" y="150"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Resource</tspan></text>
  <text x="16" y="170"></text>
  <text x="16" y="190"><tspan fill="#8b949e">/// A list of assets to place.</tspan></text>
  <text x="16" y="210"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> assets: </tspan><tspan fill="#7ee787">Array</tspan><tspan fill="#e6edf3">[</tspan><tspan fill="#7ee787">FoliageAsset</tspan><tspan fill="#e6edf3">]</tspan></text>
  <text x="16" y="230"></text>
  <text x="16" y="250"><tspan fill="#8b949e">/// Weights of each of the asset from the list above, in the same order.</tspan></text>
  <text x="16" y="270"><tspan fill="#8b949e">/// If unspecified, weights are assumed to be uniform.</tspan></text>
  <text x="16" y="290"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> weights: </tspan><tspan fill="#7ee787">PackedFloat32Array</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">PackedFloat32Array</tspan><tspan fill="#e6edf3"> weights_;</tspan></text>
  <text x="16" y="350"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">PackedFloat64Array</tspan><tspan fill="#e6edf3"> cumulative_probabilities_;</tspan></text>
  <text x="16" y="370"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="390"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">get</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="410"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> weights_;</tspan></text>
  <text x="16" y="430"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="450"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">set</tspan><tspan fill="#e6edf3">(value) {</tspan></text>
  <text x="16" y="470"><tspan fill="#e6edf3">    weights_ = value;</tspan></text>
  <text x="16" y="490"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">double</tspan><tspan fill="#e6edf3"> total_weight = </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="510"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">for</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3"> weight : weights_) {</tspan></text>
  <text x="16" y="530"><tspan fill="#e6edf3">      total_weight += weight;</tspan></text>
  <text x="16" y="550"><tspan fill="#e6edf3">    }</tspan></text>
  <text x="16" y="570"><tspan fill="#e6edf3">    cumulative_probabilities_.</tspan><tspan fill="#56d4dd">resize</tspan><tspan fill="#e6edf3">(weights_.</tspan><tspan fill="#56d4dd">size</tspan><tspan fill="#e6edf3">());</tspan></text>
  <text x="16" y="590"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">double</tspan><tspan fill="#e6edf3"> cumulative = </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="610"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">for</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> i = </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">; i &lt; weights_.</tspan><tspan fill="#56d4dd">size</tspan><tspan fill="#e6edf3">(); i++) {</tspan></text>
  <text x="16" y="630"><tspan fill="#e6edf3">      cumulative += weights_[i] / total_weight;</tspan></text>
  <text x="16" y="650"><tspan fill="#e6edf3">      cumulative_probabilities_[i] = cumulative;</tspan></text>
  <text x="16" y="670"><tspan fill="#e6edf3">    }</tspan></text>
  <text x="16" y="690"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="710"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="730"></text>
  <text x="16" y="750"><tspan fill="#8b949e">/// Assets will be only placed on the selected terrain texture ids.</tspan></text>
  <text x="16" y="770"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> textures: </tspan><tspan fill="#7ee787">PackedInt32Array</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="790"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="810"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">PackedInt32Array</tspan><tspan fill="#e6edf3"> textures_;</tspan></text>
  <text x="16" y="830"><tspan fill="#e6edf3">    </tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3"> texture_mask_ = </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="850"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="870"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">get</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="890"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> textures_;</tspan></text>
  <text x="16" y="910"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="930"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">set</tspan><tspan fill="#e6edf3">(value) {</tspan></text>
  <text x="16" y="950"><tspan fill="#e6edf3">    textures_ = value;</tspan></text>
  <text x="16" y="970"><tspan fill="#e6edf3">    texture_mask_ = </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="990"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">for</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#7ee787">int32_t</tspan><tspan fill="#e6edf3"> id : textures_) {</tspan></text>
  <text x="16" y="1010"><tspan fill="#e6edf3">      </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (id &gt;= </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3"> &amp;&amp; id &lt; </tspan><tspan fill="#d2a8ff">64</tspan><tspan fill="#e6edf3">) {</tspan></text>
  <text x="16" y="1030"><tspan fill="#e6edf3">        texture_mask_ |= </tspan><tspan fill="#d2a8ff">1ull</tspan><tspan fill="#e6edf3"> &lt;&lt; id;</tspan></text>
  <text x="16" y="1050"><tspan fill="#e6edf3">      }</tspan></text>
  <text x="16" y="1070"><tspan fill="#e6edf3">    }</tspan></text>
  <text x="16" y="1090"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="1110"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="1130"></text>
  <text x="16" y="1150"><tspan fill="#8b949e">/// Base probability of finding an asset of this collection at a lattice point.</tspan></text>
  <text x="16" y="1170"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> density: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">1.0</tspan></text>
  <text x="16" y="1190"></text>
  <text x="16" y="1210"><tspan fill="#8b949e">/// If specified, allows specifying the dependence of the asset density on height.</tspan></text>
  <text x="16" y="1230"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> height_density_curve: </tspan><tspan fill="#7ee787">Curve</tspan></text>
  <text x="16" y="1250"></text>
  <text x="16" y="1270"><tspan fill="#8b949e">/// If specified, allows specifying the dependence of the asset density on the terrain slope (in degrees).</tspan></text>
  <text x="16" y="1290"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> slope_density_curve: </tspan><tspan fill="#7ee787">Curve</tspan></text>
  <text x="16" y="1310"></text>
  <text x="16" y="1330"><tspan fill="#8b949e">/// If specified, allows specifying the dependence of the asset density on a 2d noise (in world coordinates).</tspan></text>
  <text x="16" y="1350"><tspan fill="#79c0ff">@export</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> density_noise: </tspan><tspan fill="#7ee787">Noise</tspan></text>
  <text x="16" y="1370"></text>
  <text x="16" y="1390"><tspan fill="#8b949e">/// Returns the probability of an asset from this collection to be placed at a specific location.</tspan></text>
  <text x="16" y="1410"><tspan fill="#79c0ff">@const</tspan></text>
  <text x="16" y="1430"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">get_collection_probability</tspan><tspan fill="#e6edf3">(placement: </tspan><tspan fill="#7ee787">FoliagePlacement</tspan><tspan fill="#e6edf3">, i: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="1450"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">double</tspan><tspan fill="#e6edf3"> probability = density;</tspan></text>
  <text x="16" y="1470"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (texture_mask_ != </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">) {</tspan></text>
  <text x="16" y="1490"><tspan fill="#e6edf3">    probability *= </tspan><tspan fill="#56d4dd">texture_weight</tspan><tspan fill="#e6edf3">(placement-&gt;base_texture_ids[i]) * (</tspan><tspan fill="#d2a8ff">1</tspan><tspan fill="#e6edf3"> - placement-&gt;texture_blend_amounts[i]) +</tspan></text>
  <text x="16" y="1510"><tspan fill="#e6edf3">        </tspan><tspan fill="#56d4dd">texture_weight</tspan><tspan fill="#e6edf3">(placement-&gt;overlay_texture_ids[i]) * placement-&gt;texture_blend_amounts[i];</tspan></text>
  <text x="16" y="1530"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="1550"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3"> position = placement-&gt;</tspan><tspan fill="#56d4dd">get_transform</tspan><tspan fill="#e6edf3">(i).origin;</tspan></text>
  <text x="16" y="1570"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (height_density_curve.</tspan><tspan fill="#56d4dd">is_valid</tspan><tspan fill="#e6edf3">()) {</tspan></text>
  <text x="16" y="1590"><tspan fill="#e6edf3">    probability *= height_density_curve-&gt;</tspan><tspan fill="#56d4dd">sample</tspan><tspan fill="#e6edf3">(position.y);</tspan></text>
  <text x="16" y="1610"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="1630"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (slope_density_curve.</tspan><tspan fill="#56d4dd">is_valid</tspan><tspan fill="#e6edf3">()) {</tspan></text>
  <text x="16" y="1650"><tspan fill="#e6edf3">    probability *= slope_density_curve-&gt;</tspan><tspan fill="#56d4dd">sample</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">Math</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">rad_to_deg</tspan><tspan fill="#e6edf3">(placement-&gt;</tspan><tspan fill="#56d4dd">get_slope</tspan><tspan fill="#e6edf3">(i)));</tspan></text>
  <text x="16" y="1670"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="1690"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (density_noise.</tspan><tspan fill="#56d4dd">is_valid</tspan><tspan fill="#e6edf3">()) {</tspan></text>
  <text x="16" y="1710"><tspan fill="#e6edf3">    probability *= density_noise-&gt;</tspan><tspan fill="#56d4dd">get_noise_2d</tspan><tspan fill="#e6edf3">(position.x, position.z) / </tspan><tspan fill="#d2a8ff">2.0</tspan><tspan fill="#e6edf3"> + </tspan><tspan fill="#d2a8ff">0.5</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="1730"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="1750"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> probability;</tspan></text>
  <text x="16" y="1770"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="1790"></text>
  <text x="16" y="1810"><tspan fill="#8b949e">/// Given a uniformly distributed between [0..1) number, return an asset.</tspan></text>
  <text x="16" y="1830"><tspan fill="#79c0ff">@const</tspan></text>
  <text x="16" y="1850"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">get_asset</tspan><tspan fill="#e6edf3">(uniform: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">FoliageAsset</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="1870"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> index = cumulative_probabilities_.</tspan><tspan fill="#56d4dd">is_empty</tspan><tspan fill="#e6edf3">()</tspan></text>
  <text x="16" y="1890"><tspan fill="#e6edf3">      ? (uniform * assets.</tspan><tspan fill="#56d4dd">size</tspan><tspan fill="#e6edf3">()) </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">int64_t</tspan></text>
  <text x="16" y="1910"><tspan fill="#e6edf3">      : cumulative_probabilities_.</tspan><tspan fill="#56d4dd">bsearch</tspan><tspan fill="#e6edf3">(uniform);</tspan></text>
  <text x="16" y="1930"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> index &lt; assets.</tspan><tspan fill="#56d4dd">size</tspan><tspan fill="#e6edf3">() ? assets[index] </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Ref</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">FoliageAsset</tspan><tspan fill="#e6edf3">&gt; : </tspan><tspan fill="#e3b341">nullptr</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="1950"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="1970"></text>
  <text x="16" y="1990"><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="2010"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// 1 if the texture is one of [member textures], 0 otherwise.</tspan></text>
  <text x="16" y="2030"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">double</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">texture_weight</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> id) </tspan><tspan fill="#e3b341">const</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="2050"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> id &gt;= </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3"> &amp;&amp; id &lt; </tspan><tspan fill="#d2a8ff">64</tspan><tspan fill="#e6edf3"> &amp;&amp; (texture_mask_ &amp; (</tspan><tspan fill="#d2a8ff">1ull</tspan><tspan fill="#e6edf3"> &lt;&lt; id)) ? </tspan><tspan fill="#d2a8ff">1.0</tspan><tspan fill="#e6edf3"> : </tspan><tspan fill="#d2a8ff">0.0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="2070"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="2090"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
