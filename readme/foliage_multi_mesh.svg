<svg xmlns="http://www.w3.org/2000/svg" width="839" height="549" viewBox="0 0 839 549">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">/// Renders all instances of one mesh in a chunk.</tspan></text>
  <text x="16" y="50"><tspan fill="#8b949e">/// If [member scene] is set, it turns the instances into instances of the scene, one per frame,</tspan></text>
  <text x="16" y="70"><tspan fill="#8b949e">/// which makes nearby foliage interactive.</tspan></text>
  <text x="16" y="90"><tspan fill="#79c0ff">@profile</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"foliage"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="110"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">FoliageMultiMesh</tspan></text>
  <text x="16" y="130"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">MultiMeshInstance3D</tspan></text>
  <text x="16" y="150"></text>
  <text x="16" y="170"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> scene: </tspan><tspan fill="#7ee787">PackedScene</tspan></text>
  <text x="16" y="190"></text>
  <text x="16" y="210"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">_process</tspan><tspan fill="#e6edf3">(delta: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Ref</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">MultiMesh</tspan><tspan fill="#e6edf3">&gt; mm = </tspan><tspan fill="#56d4dd">get_multimesh</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3"> count = mm.</tspan><tspan fill="#56d4dd">is_valid</tspan><tspan fill="#e6edf3">() ? mm-&gt;</tspan><tspan fill="#56d4dd">get_visible_instance_count</tspan><tspan fill="#e6edf3">() : </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (count &lt; </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">) {</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">    count = mm-&gt;</tspan><tspan fill="#56d4dd">get_instance_count</tspan><tspan fill="#e6edf3">();  </tspan><tspan fill="#8b949e">// -1 means all instances are visible.</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (scene.</tspan><tspan fill="#56d4dd">is_null</tspan><tspan fill="#e6edf3">() || count == </tspan><tspan fill="#d2a8ff">0</tspan><tspan fill="#e6edf3">) {</tspan></text>
  <text x="16" y="350"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">set_process</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#e3b341">false</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="370"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="390"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="410"><tspan fill="#e6edf3">  mm-&gt;</tspan><tspan fill="#56d4dd">set_visible_instance_count</tspan><tspan fill="#e6edf3">(--count);</tspan></text>
  <text x="16" y="430"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Node</tspan><tspan fill="#e6edf3"> *instance = scene-&gt;</tspan><tspan fill="#56d4dd">instantiate</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="450"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">if</tspan><tspan fill="#e6edf3"> (</tspan><tspan fill="#7ee787">Node3D</tspan><tspan fill="#e6edf3"> *instance3d = instance </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan><tspan fill="#e6edf3"> *) {</tspan></text>
  <text x="16" y="470"><tspan fill="#e6edf3">    instance3d-&gt;</tspan><tspan fill="#56d4dd">set_transform</tspan><tspan fill="#e6edf3">(mm-&gt;</tspan><tspan fill="#56d4dd">get_instance_transform</tspan><tspan fill="#e6edf3">(count));</tspan></text>
  <text x="16" y="490"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="510"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">add_child</tspan><tspan fill="#e6edf3">(instance);</tspan></text>
  <text x="16" y="530"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
