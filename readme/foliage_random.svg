<svg xmlns="http://www.w3.org/2000/svg" width="990" height="1309" viewBox="0 0 990 1309">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">/// A random number generator that can be seeded with positions.</tspan></text>
  <text x="16" y="50"><tspan fill="#8b949e">/// The same position (up to [member sensitivity]) always yields the same random sequence,</tspan></text>
  <text x="16" y="70"><tspan fill="#8b949e">/// which makes foliage placement deterministic, no matter which chunk asks for it.</tspan></text>
  <text x="16" y="90"><tspan fill="#79c0ff">@profile</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#d2a8ff">"foliage"</tspan><tspan fill="#e6edf3">)</tspan></text>
  <text x="16" y="110"><tspan fill="#e3b341">class_name</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">FoliageRandom</tspan></text>
  <text x="16" y="130"><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">RandomNumberGenerator</tspan></text>
  <text x="16" y="150"></text>
  <text x="16" y="170"><tspan fill="#8b949e">/// Every position seed is combined with this one, so that generators with different master seeds are independent.</tspan></text>
  <text x="16" y="190"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> master_seed: </tspan><tspan fill="#7ee787">int</tspan></text>
  <text x="16" y="210"></text>
  <text x="16" y="230"><tspan fill="#8b949e">/// Positions are rounded to multiples of this value before hashing.</tspan></text>
  <text x="16" y="250"><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> sensitivity: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3"> = </tspan><tspan fill="#d2a8ff">1e</tspan><tspan fill="#e6edf3">-</tspan><tspan fill="#d2a8ff">3</tspan></text>
  <text x="16" y="270"></text>
  <text x="16" y="290"><tspan fill="#8b949e">/// Creates a generator with the given master seed.</tspan></text>
  <text x="16" y="310"><tspan fill="#79c0ff">@static</tspan></text>
  <text x="16" y="330"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">create</tspan><tspan fill="#e6edf3">(master: </tspan><tspan fill="#7ee787">int</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">FoliageRandom</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="350"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">Ref</tspan><tspan fill="#e6edf3">&lt;</tspan><tspan fill="#7ee787">FoliageRandom</tspan><tspan fill="#e6edf3">&gt; rng;</tspan></text>
  <text x="16" y="370"><tspan fill="#e6edf3">  rng.</tspan><tspan fill="#56d4dd">instantiate</tspan><tspan fill="#e6edf3">();</tspan></text>
  <text x="16" y="390"><tspan fill="#e6edf3">  rng-&gt;master_seed = </tspan><tspan fill="#56d4dd">splitmix_hash</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">splitmix_hash</tspan><tspan fill="#e6edf3">(master </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3">)) </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="410"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> rng;</tspan></text>
  <text x="16" y="430"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="450"></text>
  <text x="16" y="470"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">seed_with_float</tspan><tspan fill="#e6edf3">(value: </tspan><tspan fill="#7ee787">float</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="490"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">reseed</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value));</tspan></text>
  <text x="16" y="510"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="530"></text>
  <text x="16" y="550"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">seed_with_vec2</tspan><tspan fill="#e6edf3">(value: </tspan><tspan fill="#7ee787">Vector2</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="570"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">reseed</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">splitmix_combine</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value.x), </tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value.y)));</tspan></text>
  <text x="16" y="590"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="610"></text>
  <text x="16" y="630"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">seed_with_vec3</tspan><tspan fill="#e6edf3">(value: </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="650"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">reseed</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">splitmix_combine</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value.x), </tspan><tspan fill="#56d4dd">splitmix_combine</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value.y), </tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value.z))));</tspan></text>
  <text x="16" y="670"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="690"></text>
  <text x="16" y="710"><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">seed_with_vec4</tspan><tspan fill="#e6edf3">(value: </tspan><tspan fill="#7ee787">Vector4</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="730"><tspan fill="#e6edf3">  </tspan><tspan fill="#56d4dd">reseed</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">splitmix_combine</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value.x),</tspan></text>
  <text x="16" y="750"><tspan fill="#e6edf3">      </tspan><tspan fill="#56d4dd">splitmix_combine</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value.y), </tspan><tspan fill="#56d4dd">splitmix_combine</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value.z), </tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(value.w)))));</tspan></text>
  <text x="16" y="770"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="790"></text>
  <text x="16" y="810"><tspan fill="#e3b341">decl</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="830"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">// The SplitMix64 finalizer.</tspan></text>
  <text x="16" y="850"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">static</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">splitmix_hash</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3"> x) {</tspan></text>
  <text x="16" y="870"><tspan fill="#e6edf3">    x ^= x &gt;&gt; </tspan><tspan fill="#d2a8ff">30</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="890"><tspan fill="#e6edf3">    x *= </tspan><tspan fill="#d2a8ff">0xbf58476d1ce4e5b9ull</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="910"><tspan fill="#e6edf3">    x ^= x &gt;&gt; </tspan><tspan fill="#d2a8ff">27</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="930"><tspan fill="#e6edf3">    x *= </tspan><tspan fill="#d2a8ff">0x94d049bb133111ebull</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="950"><tspan fill="#e6edf3">    x ^= x &gt;&gt; </tspan><tspan fill="#d2a8ff">31</tspan><tspan fill="#e6edf3">;</tspan></text>
  <text x="16" y="970"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> x;</tspan></text>
  <text x="16" y="990"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="1010"></text>
  <text x="16" y="1030"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">static</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">splitmix_combine</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3"> a, </tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3"> b) {</tspan></text>
  <text x="16" y="1050"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> a ^ (b + </tspan><tspan fill="#d2a8ff">0x9e3779b97f4a7c15ull</tspan><tspan fill="#e6edf3"> + (a &lt;&lt; </tspan><tspan fill="#d2a8ff">6</tspan><tspan fill="#e6edf3">) + (a &gt;&gt; </tspan><tspan fill="#d2a8ff">2</tspan><tspan fill="#e6edf3">));</tspan></text>
  <text x="16" y="1070"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="1090"></text>
  <text x="16" y="1110"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">quantize</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">double</tspan><tspan fill="#e6edf3"> value) </tspan><tspan fill="#e3b341">const</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="1130"><tspan fill="#e6edf3">    </tspan><tspan fill="#8b949e">// Round to int64_t first: converting a negative double straight to uint64_t is undefined.</tspan></text>
  <text x="16" y="1150"><tspan fill="#e6edf3">    </tspan><tspan fill="#e3b341">return</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">splitmix_hash</tspan><tspan fill="#e6edf3">((</tspan><tspan fill="#7ee787">Math</tspan><tspan fill="#e6edf3">::</tspan><tspan fill="#56d4dd">round</tspan><tspan fill="#e6edf3">(value / sensitivity) </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">int64_t</tspan><tspan fill="#e6edf3">) </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3">);</tspan></text>
  <text x="16" y="1170"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="1190"></text>
  <text x="16" y="1210"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">void</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">reseed</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3"> hash) {</tspan></text>
  <text x="16" y="1230"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">set_seed</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#56d4dd">splitmix_combine</tspan><tspan fill="#e6edf3">(master_seed </tspan><tspan fill="#e3b341">as</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">uint64_t</tspan><tspan fill="#e6edf3">, hash));</tspan></text>
  <text x="16" y="1250"><tspan fill="#e6edf3">    </tspan><tspan fill="#56d4dd">randf</tspan><tspan fill="#e6edf3">();  </tspan><tspan fill="#8b949e">// Skip the first value, which is poorly mixed right after seeding.</tspan></text>
  <text x="16" y="1270"><tspan fill="#e6edf3">  }</tspan></text>
  <text x="16" y="1290"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
