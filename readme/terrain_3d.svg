<svg xmlns="http://www.w3.org/2000/svg" width="831" height="349" viewBox="0 0 831 349">
  <rect width="100%" height="100%" rx="8" fill="#0d1117"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <text x="16" y="30"><tspan fill="#8b949e">// Terrain3D is a separate GDExtension, so we only know it at runtime: every call goes by name.</tspan></text>
  <text x="16" y="50"></text>
  <text x="16" y="70"><tspan fill="#e3b341">extern</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Terrain3D</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="90"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Node3D</tspan></text>
  <text x="16" y="110"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">var</tspan><tspan fill="#e6edf3"> data: </tspan><tspan fill="#7ee787">Terrain3DData</tspan></text>
  <text x="16" y="130"><tspan fill="#e6edf3">}</tspan></text>
  <text x="16" y="150"></text>
  <text x="16" y="170"><tspan fill="#e3b341">extern</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Terrain3DData</tspan><tspan fill="#e6edf3"> {</tspan></text>
  <text x="16" y="190"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">extends</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#7ee787">Object</tspan></text>
  <text x="16" y="210"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">@const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">get_height</tspan><tspan fill="#e6edf3">(position: </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">float</tspan></text>
  <text x="16" y="230"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">@const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">get_normal</tspan><tspan fill="#e6edf3">(position: </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">Vector3</tspan></text>
  <text x="16" y="250"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">@const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">get_control_hole</tspan><tspan fill="#e6edf3">(position: </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">bool</tspan></text>
  <text x="16" y="270"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">@const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">get_control_base_id</tspan><tspan fill="#e6edf3">(position: </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">int</tspan></text>
  <text x="16" y="290"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">@const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">get_control_overlay_id</tspan><tspan fill="#e6edf3">(position: </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">int</tspan></text>
  <text x="16" y="310"><tspan fill="#e6edf3">  </tspan><tspan fill="#79c0ff">@const</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">func</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#56d4dd">get_control_blend</tspan><tspan fill="#e6edf3">(position: </tspan><tspan fill="#7ee787">Vector3</tspan><tspan fill="#e6edf3">) -&gt; </tspan><tspan fill="#7ee787">float</tspan></text>
  <text x="16" y="330"><tspan fill="#e6edf3">}</tspan></text>
  </g>
</svg>
